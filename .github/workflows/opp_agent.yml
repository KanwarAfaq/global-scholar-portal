name: Daily ScholarPortal Agent

on:
  schedule:
    # 00:17 UTC daily (08:17 Taiwan)
    - cron: '17 0 * * *'
  workflow_dispatch:

jobs:
  run-hunter-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        working-directory: ./Agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Opportunity Hunter, Blog Writer & Facebook Publisher
        working-directory: ./Agent
        env:
          # LINE
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}

          # Supabase
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          # Cloudinary - agent.py uses these server-side names
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

          # Existing frontend Cloudinary values (kept if other code needs them)
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}

          # AI gateways
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY2: ${{ secrets.VITE_GEMINI_API_KEY2 }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GROQ_API_KEY2: ${{ secrets.VITE_GROQ_API_KEY2 }}
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
          VITE_OPENAI_API_KEY2: ${{ secrets.VITE_OPENAI_API_KEY2 }}
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_API_KEY2: ${{ secrets.HF_API_KEY2 }}

          # Facebook
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: ${{ secrets.FACEBOOK_GRAPH_API_VERSION }}
          FACEBOOK_PUBLISH_ENABLED: "true"
          FACEBOOK_USE_PHOTO_POST: "true"
          FACEBOOK_MAX_POSTS_PER_RUN: "6"

          # Cinematic Facebook video
          FACEBOOK_VIDEO_ENABLED: "true"
          FACEBOOK_MAX_VIDEOS_PER_RUN: "4"

          # ScholarPortal
          SCHOLARPORTAL_BASE_URL: "https://scholarportal.site"

          # Email
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}

        run: |
          python agent.py
