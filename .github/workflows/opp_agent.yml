name: Daily ScholarPortal Multi-Agent Pipeline

on:
  schedule:
    # 00:17 UTC daily (08:17 Taiwan)
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opp_agent.yml'
      - 'Agent/**'

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python dependencies
        working-directory: ./Agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run verified opportunity + monetization agents
        working-directory: ./Agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}

          # Research fallbacks (at least one is recommended; DuckDuckGo HTML is final no-key fallback)
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BING_SEARCH_API_KEY: ${{ secrets.BING_SEARCH_API_KEY }}

          # Multi-provider AI router. Configure every key you have; missing providers are skipped.
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
          AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || 'cgu,groq,nvidia-nim,mistral,openrouter' }}
          CGU_MODEL: ${{ vars.CGU_MODEL || 'gpt-4o' }}
          NVIDIA_NIM_MODEL: ${{ vars.NVIDIA_NIM_MODEL || 'openai/gpt-oss-20b' }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL || 'mistral-small-latest' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          # Notifications are part of the production run and must not be silently skipped.
          AGENT_ALLOW_OUTBOUND: 'true'
          ADMIN_NOTIFICATION_EMAIL: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Notifications: SMTP only
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ADMIN_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.ADMIN_LINE_CHANNEL_ACCESS_TOKEN }}
          ADMIN_LINE_RECIPIENT_ID: ${{ secrets.ADMIN_LINE_RECIPIENT_ID }}
          MIN_OPPORTUNITIES_PER_RUN: ${{ vars.MIN_OPPORTUNITIES_PER_RUN || '3' }}

          # Existing social publishing remains optional and receives only verified content.
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: ${{ secrets.FACEBOOK_GRAPH_API_VERSION }}
          FACEBOOK_PUBLISH_ENABLED: 'true'
          FACEBOOK_MAX_POSTS_PER_RUN: '1'
          SCHOLARPORTAL_BASE_URL: ${{ vars.SCHOLARPORTAL_BASE_URL }}
        run: python agent.py
