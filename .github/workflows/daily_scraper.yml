name: ScholarPortal Sitemap Refresh

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sitemap dependencies
        run: pip install -r Agent/requirements.txt
      - name: Generate sitemap, crawler snapshots, robots and LLM discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SCHOLARPORTAL_BASE_URL: ${{ vars.SCHOLARPORTAL_BASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python Agent/indexing_agent.py
      - name: Commit search artifacts if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/sitemap.xml public/robots.txt public/seo-pages.json public/llms.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh verified ScholarPortal sitemap"
            git pull --rebase origin main
            git push origin main
          fi
