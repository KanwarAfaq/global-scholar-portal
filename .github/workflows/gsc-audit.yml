name: Google Search Console Read-Only Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 1'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - name: Query Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_DOMAIN: scholarportal.site
        run: python scripts/gsc_readonly_audit.py
      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-seo-audit
          path: reports/gsc-audit.json
          if-no-files-found: warn
          retention-days: 30
